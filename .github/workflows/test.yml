name: Tests

on:
  push:
    branches: ['develop-v4']
  pull_request:
    branches: ['develop-v4']
  workflow_dispatch:

jobs:
  # The unit suite needs no database, it only exercises SQL generation and
  # in-memory model behaviour so it runs once here rather than four times
  # inside the matrix below.
  test-unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test-unit

  test-postgres:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node and Postgres versions exercise different layers, so we sweep one
        # axis at a time rather than running the full cross product.
        node-version: [20, 22, 24]
        postgres:
          - version: 17
            image: postgis/postgis:17-3.5
        include:
          - node-version: 24
            postgres:
              version: 18
              image: postgis/postgis:18-3.6

    name: test-postgres (node ${{ matrix.node-version }}, pg ${{ matrix.postgres.version }})

    services:
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_USER: sequelize_test
          POSTGRES_PASSWORD: sequelize_test
          POSTGRES_DB: sequelize_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sequelize_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install Postgres extensions
        env:
          PGPASSWORD: sequelize_test
        run: psql -h localhost -U sequelize_test -d sequelize_test -f test/config/init-postgres.sql

      - run: pnpm install --frozen-lockfile

      # Integration only — the unit suite is covered once by the test-unit job.
      - name: Run integration tests
        env:
          DIALECT: postgres
          SEQ_PORT: 5432
          SEQ_USER: sequelize_test
          SEQ_PW: sequelize_test
          SEQ_DB: sequelize_test
        run: pnpm run test-integration-postgres
