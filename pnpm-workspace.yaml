# pnpm blocks dependency build scripts by default, and fails the install when an
# unapproved package has one. This one compiles native bindings:
#   libpq -> addon.node   (transitive via pg-native, postgres-native dialect)
allowBuilds:
  libpq: true

minimumReleaseAgeExclude:
  - vitest@5.0.3
  - '@vitest/mocker@5.0.3'
  - '@vitest/spy@5.0.3'
